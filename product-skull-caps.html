
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE SECOND SKIN | OUTLINR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #101010;
      color: #f2efe8;
      font-family: Arial, Helvetica, sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 7%;
      border-bottom: 1px solid #292929;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .back-link {
      font-size: 11px;
      letter-spacing: 2px;
    }

    .product {
      max-width: 1100px;
      margin: 55px auto;
      padding: 0 6%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .product img {
      width: 100%;
      display: block;
      object-fit: cover;
      background: #1b1b1b;
    }

    .eyebrow {
      color: #e34343;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(35px, 5vw, 58px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .description {
      color: #aaa69e;
      font-size: 14px;
      line-height: 1.9;
      margin-bottom: 28px;
    }

    .price {
      font-size: 16px;
      margin-bottom: 28px;
    }

    .status {
      display: inline-block;
      border: 1px solid #e34343;
      color: #e34343;
      padding: 12px 18px;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .collection-link {
      display: block;
      width: fit-content;
      border-bottom: 1px solid #f2efe8;
      padding-bottom: 7px;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .philosophy {
      text-align: center;
      border-top: 1px solid #292929;
      padding: 35px 15px;
      color: #aaa69e;
      font-size: 11px;
      letter-spacing: 3px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 10px;
      letter-spacing: 2px;
    }

    @media (max-width: 700px) {
      header { padding: 20px 5%; }
      .logo { font-size: 20px; letter-spacing: 3px; }
      .back-link { font-size: 9px; }
      .product {
        grid-template-columns: 1fr;
        gap: 30px;
        margin: 30px auto;
        padding: 0 6%;
      }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">OUTLINR</a>
    <a class="back-link" href="index.html">BACK TO SHOP ↗</a>
  </header>

  <main class="product">
    <img
      src="https://images.unsplash.com/photo-1575428652377-a2d80e2277fc?auto=format&fit=crop&w=1000&q=85"
      alt="Essential OUTLINR headwear"
    >

    <section>
      <p class="eyebrow">ESSENTIAL HEADWEAR</p>
      <h1>THE SECOND SKIN</h1>
      <p class="description">
        Minimal in form. Distinct in identity.
        Essential headwear designed to complete your look
        without defining who you are.
      </p>

      <p class="price">Price coming soon</p>
      <span class="status">COMING SOON</span>

      <a class="collection-link" href="index.html">
        ← BACK TO COLLECTION
      </a>
    </section>
  </main>

  <section class="philosophy">
    YOU WEAR IT. YOU DEFINE IT.
  </section>

  <footer>
    © 2026 OUTLINR. DARE TO DIFFER.
  </footer>

</body>
</html>
